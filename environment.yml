name: hybrid-gcs
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - numpy>=1.21.0
  - scipy>=1.7.0
  - conda-forge::pytorch>=1.10.0
  - cudatoolkit>=11.8
  - pydantic>=1.8.0
  - pyyaml>=5.4.0
  # Development
  - pytest>=6.2.0
  - pytest-cov>=2.12.0
  - black>=21.7
  - isort>=5.9.0
  - pylint>=2.9.0
  - mypy>=0.910
  - sphinx>=4.0.0
  # Solvers
  - pip
  - pip:
      - -e ".[dev]"
      - scs>=3.0.0
      # Foxglove / MCAP visualization
      - mcap>=1.1.0
      - mcap-protobuf-support>=0.5.0
      - foxglove-schemas-protobuf>=0.3.0
